[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[project]
name = "cookiecutter_project"
version = "0.0.1"
description = "A simple test on cookiecutter."
authors = [
  { name = "davidlindahl", email = "your@email.com" },
]
license = { file = "LICENSE" }
keywords = ["machine learning", "MLOps"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dvc>=3.66.1",
    "fastapi==0.115.6",
    "ipykernel>=7.1.0",
    "kernel>=0.26.0",
    "matplotlib>=3.10.8",
    "numpy",
    "opencv-python>=4.13.0.90",
    "python-multipart>=0.0.21",
    "requests>=2.32.5",
    "ruff>=0.1.3",
    "scikit-learn",
    "torch==2.6.0",
    "typer>=0.21.0",
    "uvicorn==0.34.0",
]

[dependency-groups]
dev = [
    "coverage==7.6.9",
    "invoke==2.2.0",
    "mkdocs-material==9.4.6",
    "mkdocs==1.6.1",
    "pre-commit==4.1.0",
    "pytest==8.3.4",
    "ruff==0.1.3",
    "mkdocstrings-python==1.12.2",
]


[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120

[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
